# Publish the API and UI container images to GitHub Container Registry.
#
# Every push to main refreshes the rolling `main` tag; pushing a `v*` git tag
# (e.g. `git tag v0.2.0 && git push origin v0.2.0`) publishes the versioned
# `X.Y.Z`, `X.Y` and `latest` tags. Both images are built from the same
# Dockerfiles `make docker` and a platform deploy use, so the published image is
# the same artifact a local build produces at that commit.
#
# The job is guarded to this repository: the saas fork syncs with
# `git merge upstream/main` and would otherwise run this on every push to its
# own main, and a third-party fork would try to push under its own account.
# A fork that wants its own images changes the guard and the image names.
#
# linux/amd64 only. The API image bakes torch plus two embedding-model caches
# (see docker/Dockerfile); building that under arm64 emulation is impractically
# slow. Multi-arch is a follow-up.
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a half-pushed release.
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    if: github.repository == 'SenteLabsAI/OpenExecutive'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile
            image: ghcr.io/sentelabsai/openexecutive-api
          - name: ui
            dockerfile: docker/Dockerfile.ui
            image: ghcr.io/sentelabsai/openexecutive-ui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag set:
      #   v1.2.3 tag  -> 1.2.3, 1.2, latest, sha-<short>
      #   main push   -> main, sha-<short>
      # `latest` follows semver tags only (metadata-action's default
      # latest=auto), never a branch push. No bare `{{major}}` tag while the
      # project is pre-1.0 — a `0` tag would be misleading.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
